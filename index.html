<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odoo 19 Certification — Free Practice Exam</title>
<meta name="description" content="Free practice exam for the Odoo 19 Functional Certification: timed exam mode with penalty scoring, practice mode with explanations.">
<meta name="theme-color" content="#714B67">
<style>
  :root{
    --brand:#714B67; --brand-2:#017E84; --bg:#f6f4f7; --card:#fff; --text:#1f1a22; --muted:#6b6470;
    --line:#e4dfe7; --ok:#1e8e3e; --ok-bg:#e6f4ea; --bad:#c5221f; --bad-bg:#fce8e6; --warn:#b06000; --warn-bg:#fef3e0;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141116; --card:#1e1a21; --text:#eee9f0; --muted:#a59cab; --line:#332c38;
      --ok-bg:#16301f; --bad-bg:#3a1a1a; --warn-bg:#3a2a12; --brand:#b48aa9; --brand-2:#3fb8bd; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
  @media (prefers-color-scheme: dark){ header{background:#3d2937} }
  header h1{font-size:17px;margin:0;flex:1;font-weight:650}
  #timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:8px;display:none}
  #timer.low{background:#c5221f}
  main{max-width:820px;margin:0 auto;padding:18px 14px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  h2{margin:0 0 8px;font-size:20px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:10px;cursor:pointer}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.teal{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;margin:3px}
  .rules li{margin:3px 0}
  .q-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
  .q-text{font-size:17px;font-weight:550;margin:4px 0 14px}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand) inset}
  .opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .explain{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);font-size:15px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
  .grid button{padding:6px 0;font-size:13px;border-radius:8px}
  .grid .ans{background:var(--brand);color:#fff;border-color:var(--brand)}
  .grid .flag{outline:2px solid var(--warn);outline-offset:-2px}
  .grid .cur{box-shadow:0 0 0 2px var(--brand-2)}
  .grid .r{background:var(--ok);color:#fff;border-color:var(--ok)}
  .grid .w{background:var(--bad);color:#fff;border-color:var(--bad)}
  .score{font-size:44px;font-weight:800;margin:4px 0}
  .pass{color:var(--ok)} .fail{color:var(--bad)}
  .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--brand-2)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  .hidden{display:none!important}
  footer{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
  a{color:var(--brand-2)}
</style>
</head>
<body>
<header>
  <h1>Odoo 19 · Practice Exam</h1>
  <span id="timer">90:00</span>
</header>

<main id="app"></main>
<div class="nav hidden" id="nav"></div>

<script src="questions.js"></script>
<script>
(() => {
  const Q = window.QUESTIONS.map((q, i) => ({ id: i, module: q[0], text: q[1], options: q[2], correct: q[3], explain: q[4] }));
  const MODULES = [...new Set(Q.map(q => q.module))];
  const SEC_PER_Q = 45;           // real exam: 120 questions / 90 min
  const PASS = 0.70, PENALTY = 0.5;
  const app = document.getElementById('app'), nav = document.getElementById('nav'), timerEl = document.getElementById('timer');
  let S = null, tick = null;

  const store = {
    get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const L = 'ABCDEFGH';

  // ───────── Home ─────────
  function home(){
    clearInterval(tick); timerEl.style.display = 'none'; nav.classList.add('hidden');
    const hist = store.get('odoo19_hist', []);
    const sizes = [20, 40, 60, Q.length].filter((v, i, a) => v <= Q.length && a.indexOf(v) === i);
    app.innerHTML = `
      <div class="card">
        <h2>Free Odoo 19 Functional Certification practice</h2>
        <p class="muted">${Q.length} original questions across ${MODULES.length} areas. Answer orders are shuffled on every attempt.</p>
        <ul class="rules small">
          <li><b>Exam mode</b> works like the real test: timed (45 s per question, so 120 questions take 90 min), <b>+1</b> per correct answer, <b>−0.5</b> per wrong answer, <b>0</b> for a blank. You need <b>70%</b> to pass.</li>
          <li><b>Practice mode</b> has no timer and shows the answer and explanation right after you answer.</li>
        </ul>
      </div>
      <div class="card">
        <h2>Areas</h2>
        <div id="mods">${MODULES.map(m => `<label class="chk"><input type="checkbox" value="${esc(m)}" checked> ${esc(m)} <span class="muted">(${Q.filter(q => q.module === m).length})</span></label>`).join('')}</div>
        <div class="row" style="margin-top:12px">
          <label class="small">Questions
            <select id="size">${sizes.map(n => `<option value="${n}" ${n === Math.min(60, Q.length) ? 'selected' : ''}>${n === Q.length ? 'All (' + n + ')' : n}</option>`).join('')}</select>
          </label>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="primary" id="goExam">Start exam mode</button>
          <button class="teal" id="goPractice">Start practice mode</button>
        </div>
      </div>
      ${hist.length ? `<div class="card"><h2>Your last attempts</h2><table><tr><th>Date</th><th>Mode</th><th>Questions</th><th>Score</th></tr>
        ${hist.slice(-8).reverse().map(h => `<tr><td>${esc(h.date)}</td><td>${esc(h.mode)}</td><td>${h.n}</td><td class="${h.pct >= 70 ? 'pass' : 'fail'}"><b>${h.pct}%</b></td></tr>`).join('')}</table></div>` : ''}
      <footer>Not affiliated with Odoo S.A. This is a community study aid. Take the official exam on <a href="https://www.odoo.com/slides/odoo-19-functional-certification-502" target="_blank" rel="noopener">odoo.com</a>.</footer>`;
    const start = mode => {
      const mods = [...document.querySelectorAll('#mods input:checked')].map(i => i.value);
      const pool = Q.filter(q => mods.includes(q.module));
      if (!pool.length) { alertBox('Select at least one area.'); return; }
      const n = Math.min(+document.getElementById('size').value, pool.length);
      begin(mode, shuffle(pool).slice(0, n));
    };
    document.getElementById('goExam').onclick = () => start('exam');
    document.getElementById('goPractice').onclick = () => start('practice');
  }
  function alertBox(msg){ const d = document.createElement('div'); d.className = 'card'; d.style.borderColor = 'var(--bad)'; d.textContent = msg; app.prepend(d); setTimeout(() => d.remove(), 2500); }

  // ───────── Session ─────────
  function begin(mode, qs){
    S = {
      mode, i: 0, done: false,
      items: qs.map(q => { const order = shuffle(q.options.map((_, k) => k)); return { q, order, ans: null, flag: false }; }),
      left: qs.length * SEC_PER_Q
    };
    if (mode === 'exam') {
      timerEl.style.display = 'inline-block'; timerEl.textContent = fmt(S.left); timerEl.classList.remove('low');
      tick = setInterval(() => {
        S.left--; timerEl.textContent = fmt(Math.max(0, S.left));
        if (S.left <= 300) timerEl.classList.add('low');
        if (S.left <= 0) { clearInterval(tick); finish(true); }
      }, 1000);
    }
    window.scrollTo(0, 0); render();
  }

  function render(){
    const it = S.items[S.i], q = it.q, practice = S.mode === 'practice';
    const revealed = practice && it.ans !== null;
    const answered = S.items.filter(x => x.ans !== null).length;
    app.innerHTML = `
      <div class="card">
        <div class="q-meta"><span>Question ${S.i + 1} / ${S.items.length}</span><span class="tag">${esc(q.module)}</span></div>
        <div class="q-text">${esc(q.text)}</div>
        ${it.order.map((k, pos) => {
          let cls = 'opt';
          if (it.ans === k) cls += ' sel';
          if (revealed) { if (k === q.correct) cls += ' right'; else if (it.ans === k) cls += ' wrong'; }
          return `<button class="${cls}" data-k="${k}" ${revealed ? 'disabled style="opacity:1;cursor:default"' : ''}><span class="k">${L[pos]}</span><span>${esc(q.options[k])}</span></button>`;
        }).join('')}
        ${revealed ? `<div class="explain"><b>${it.ans === q.correct ? '✅ Correct.' : '❌ Not quite.'}</b> ${esc(q.explain)}</div>` : ''}
        ${!practice ? `<div class="row" style="margin-top:10px">
            <button id="flag">${it.flag ? '🚩 Flagged' : '⚑ Flag for review'}</button>
            ${it.ans !== null ? '<button id="clear">Clear answer</button>' : ''}
          </div>` : ''}
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b>Progress</b><span class="muted small">${answered}/${S.items.length} answered</span></div>
        <div class="bar"><i style="width:${answered / S.items.length * 100}%"></i></div>
        <div class="grid">${S.items.map((x, n) => {
          let c = '';
          if (practice && x.ans !== null) c = x.ans === x.q.correct ? 'r' : 'w';
          else if (x.ans !== null) c = 'ans';
          if (x.flag) c += ' flag';
          if (n === S.i) c += ' cur';
          return `<button class="${c}" data-go="${n}">${n + 1}</button>`;
        }).join('')}</div>
      </div>`;
    nav.classList.remove('hidden');
    nav.innerHTML = `
      <button id="prev" ${S.i === 0 ? 'disabled' : ''}>‹ Prev</button>
      <button id="quit">Quit</button>
      ${S.i < S.items.length - 1 ? '<button class="primary" id="next">Next ›</button>' : ''}
      <button class="teal" id="submit">${practice ? 'Finish' : 'Submit'}</button>`;

    app.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (revealed) return; it.ans = +b.dataset.k; render(); });
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; render(); window.scrollTo(0, 0); });
    const f = document.getElementById('flag'); if (f) f.onclick = () => { it.flag = !it.flag; render(); };
    const c = document.getElementById('clear'); if (c) c.onclick = () => { it.ans = null; render(); };
    document.getElementById('prev').onclick = () => { S.i--; render(); window.scrollTo(0, 0); };
    const n = document.getElementById('next'); if (n) n.onclick = () => { S.i++; render(); window.scrollTo(0, 0); };
    document.getElementById('submit').onclick = () => confirmBox(
      S.mode === 'exam' ? `Submit the exam? ${S.items.length - answered} unanswered, ${S.items.filter(x => x.flag).length} flagged.` : 'Finish practice and see results?',
      () => finish(false));
    document.getElementById('quit').onclick = () => confirmBox('Quit without saving this attempt?', home);
  }

  function confirmBox(msg, yes){
    nav.innerHTML = `<span style="align-self:center" class="small">${esc(msg)}</span><button id="no">Cancel</button><button class="primary" id="yes">Yes</button>`;
    document.getElementById('no').onclick = render;
    document.getElementById('yes').onclick = yes;
  }

  // ───────── Results ─────────
  function finish(timeUp){
    clearInterval(tick); S.done = true; nav.classList.add('hidden'); timerEl.style.display = 'none';
    let right = 0, wrong = 0, blank = 0; const per = {};
    S.items.forEach(x => {
      const m = per[x.q.module] ||= { r: 0, w: 0, b: 0, n: 0 }; m.n++;
      if (x.ans === null) { blank++; m.b++; } else if (x.ans === x.q.correct) { right++; m.r++; } else { wrong++; m.w++; }
    });
    const n = S.items.length;
    const pts = right - PENALTY * wrong;
    const pct = Math.max(0, Math.round(pts / n * 1000) / 10);
    const passed = pct >= PASS * 100;
    const hist = store.get('odoo19_hist', []);
    hist.push({ date: new Date().toLocaleDateString(), mode: S.mode, n, pct }); store.set('odoo19_hist', hist.slice(-50));

    const mistakes = S.items.filter(x => x.ans !== x.q.correct);
    app.innerHTML = `
      <div class="card">
        ${timeUp ? '<p class="fail"><b>⏰ Time is up — the exam was submitted automatically.</b></p>' : ''}
        <div class="muted small">${S.mode === 'exam' ? 'Exam mode' : 'Practice mode'} · ${n} questions</div>
        <div class="score ${passed ? 'pass' : 'fail'}">${pct}%</div>
        <b class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS 🎉' : 'Below the 70% pass mark'}</b>
        <p class="small muted">✅ ${right} correct (+${right}) · ❌ ${wrong} wrong (−${wrong * PENALTY}) · ⬜ ${blank} blank · <b>${pts} / ${n} points</b></p>
        ${wrong > 0 && blank === 0 ? '<p class="small">Tip: in the real exam, a wrong answer costs 0.5 points. Leaving a question blank is safer when you are truly guessing.</p>' : ''}
        <div class="row"><button class="primary" id="again">New attempt</button>${mistakes.length ? '<button class="teal" id="retry">Retry my mistakes</button>' : ''}</div>
      </div>
      <div class="card">
        <h2>By area</h2>
        <table><tr><th>Area</th><th>Correct</th><th>Score</th></tr>
        ${Object.entries(per).sort((a, b) => (a[1].r / a[1].n) - (b[1].r / b[1].n)).map(([m, v]) => {
          const p = Math.max(0, Math.round((v.r - PENALTY * v.w) / v.n * 100));
          return `<tr><td>${esc(m)}</td><td>${v.r}/${v.n}</td><td style="width:40%"><div class="bar"><i style="width:${p}%;background:${p >= 70 ? 'var(--ok)' : 'var(--bad)'}"></i></div><span class="small">${p}%</span></td></tr>`;
        }).join('')}</table>
      </div>
      <div class="card">
        <h2>Review (${mistakes.length} to revisit)</h2>
        ${mistakes.length ? mistakes.map(x => `
          <div style="border-top:1px solid var(--line);padding:12px 0">
            <div class="q-meta"><span class="tag">${esc(x.q.module)}</span><span>${x.ans === null ? 'Blank' : 'Wrong'}</span></div>
            <div style="font-weight:550">${esc(x.q.text)}</div>
            ${x.ans !== null ? `<div class="small fail">Your answer: ${esc(x.q.options[x.ans])}</div>` : ''}
            <div class="small pass">Correct: ${esc(x.q.options[x.q.correct])}</div>
            <div class="explain small">${esc(x.q.explain)}</div>
          </div>`).join('') : '<p>Perfect score, nothing to review!</p>'}
      </div>`;
    window.scrollTo(0, 0);
    document.getElementById('again').onclick = home;
    const r = document.getElementById('retry'); if (r) r.onclick = () => begin('practice', shuffle(mistakes.map(x => x.q)));
  }

  home();
})();
</script>
</body>
</html>
